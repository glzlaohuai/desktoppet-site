# Install only this dedicated virtual host; do not change the default server.
# HTTP-only bootstrap. certbot --nginx adds the TLS listener and HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name desktoppet.hiimobapps.cn;
    root /var/www/desktoppet/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    access_log /var/log/nginx/desktoppet.access.log;
    error_log /var/log/nginx/desktoppet.error.log;

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ /\. { deny all; }
    location /assets/ { expires 1h; }
}
