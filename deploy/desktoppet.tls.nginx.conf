server {
    listen 80;
    listen [::]:80;
    server_name desktoppet.hiimobapps.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://desktoppet.hiimobapps.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name desktoppet.hiimobapps.cn;
    root /var/www/desktoppet/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/desktoppet.hiimobapps.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desktoppet.hiimobapps.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    access_log /var/log/nginx/desktoppet.access.log;
    error_log /var/log/nginx/desktoppet.error.log;

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ /\. { deny all; }
    location /assets/ { expires 1h; }
}
